services:
  - type: web
    name: daily-planner-bot
    runtime: python
    plan: free
    region: singapore  # closest Render region to the Supabase project (Tokyo)
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TICK_KEY
        generateValue: true
